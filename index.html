<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Antigravity Embedded Tutor — Initiate the 0-to-Pro embedded systems curriculum. From Ohm's Law to FreeRTOS production firmware.">
  <title>Antigravity Embedded Tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/tutor.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    /* animated PCB traces */
    .pcb-trace {
      position: fixed; pointer-events: none; z-index: 0;
      stroke: rgba(0,212,255,0.15); stroke-width: 1.5; fill: none;
      stroke-dasharray: 200; stroke-dashoffset: 200;
      animation: trace-draw 3s ease forwards;
    }
    @keyframes trace-draw { to { stroke-dashoffset: 0; } }
    /* Feature pill row */
    .boot-features {
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px;
    }
    .boot-feature-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 99px;
      background: rgba(0,212,255,0.06); border: 1px solid rgba(0,212,255,0.12);
      font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
    }
    .boot-feature-pill .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); }
  </style>
</head>
<body>

<!-- Animated PCB traces in background -->
<svg style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:0.4" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <polyline class="pcb-trace" points="100,200 200,200 200,400 600,400" style="animation-delay:0.2s;"/>
  <polyline class="pcb-trace" points="1340,100 1200,100 1200,300 900,300" style="animation-delay:0.5s;"/>
  <polyline class="pcb-trace" points="200,800 400,800 400,600 700,600" style="animation-delay:0.8s;"/>
  <polyline class="pcb-trace" points="1000,800 1000,500 1300,500" style="animation-delay:1.1s;"/>
  <circle cx="600" cy="400" r="4" fill="rgba(0,212,255,0.4)" style="animation:fade-in 0.3s 1.5s both"/>
  <circle cx="1200" cy="300" r="4" fill="rgba(0,212,255,0.4)" style="animation:fade-in 0.3s 1.8s both"/>
  <circle cx="700" cy="600" r="4" fill="rgba(0,232,122,0.4)" style="animation:fade-in 0.3s 2.1s both"/>
</svg>

<!-- ═══════════════════════════════════════
     BOOT SCREEN
     ═══════════════════════════════════════ -->
<div id="boot-screen" style="position:relative; z-index:1; width:100%;">

  <div class="boot-logo">
    <div class="logo-mark">ANTIGRAVITY</div>
    <span class="logo-tagline">Embedded Systems Career Training · 0 → Principal Engineer</span>

    <div class="boot-features">
      <div class="boot-feature-pill"><div class="dot"></div>32 Lessons · 5 Phases</div>
      <div class="boot-feature-pill"><div class="dot" style="background:var(--green)"></div>Phase-Gated Curriculum</div>
      <div class="boot-feature-pill"><div class="dot" style="background:var(--violet)"></div>MNC Interview Prep</div>
      <div class="boot-feature-pill"><div class="dot" style="background:var(--gold)"></div>Career Intelligence</div>
    </div>
  </div>

  <div class="boot-terminal">
    <div class="boot-terminal-bar">
      <div class="boot-dots">
        <div class="boot-dot red"></div>
        <div class="boot-dot yellow"></div>
        <div class="boot-dot green"></div>
      </div>
      <span class="boot-terminal-title">ag-tutor-core@arm-cortex-m4:~$</span>
      <span style="margin-left:auto; font-family:var(--font-mono); font-size:10px; color:var(--green);">● SYSTEM READY</span>
    </div>

    <div class="boot-terminal-body" id="boot-terminal-body">
      <!-- Boot lines injected by JS -->
      <div class="boot-input-row" id="boot-input-row">
        <span class="boot-prompt">ag@tutor:~$</span>
        <input type="text" id="boot-input" placeholder="INITIATE ANTIGRAVITY" autocomplete="off" spellcheck="false">
        <div class="boot-cursor"></div>
      </div>
      <div class="boot-error-msg hidden" id="boot-error"></div>
    </div>
  </div>

  <!-- Returning user link -->
  <div style="text-align:center; margin-top:20px;">
    <a href="tutor.html" id="returning-link" style="font-family:var(--font-mono); font-size:12px; color:var(--text-muted); text-decoration:none; padding:8px 16px; border:1px solid var(--glass-border); border-radius:8px; display:inline-block; transition:all 0.2s ease;" onmouseover="this.style.color='var(--cyan)'; this.style.borderColor='var(--cyan)'" onmouseout="this.style.color='var(--text-muted)'; this.style.borderColor='var(--glass-border)'">
      Returning student? Resume session →
    </a>
  </div>
</div>

<!-- Scripts -->
<script src="js/curriculum-data.js"></script>
<script src="js/tutor-persona.js"></script>
<script src="js/knowledge-check.js"></script>
<script src="js/tutor-engine.js"></script>
<script src="js/tutor-chat.js"></script>
<script src="js/career-coach.js"></script>
<script src="js/interview-prep.js"></script>
<script src="js/app.js"></script>

<script>
window.startTutorApp = function() {
  sessionStorage.setItem('ag_boot_ok', '1');
  setTimeout(() => { window.location.href = 'tutor.html'; }, 100);
};

// Show/hide returning link based on saved state
document.addEventListener('DOMContentLoaded', () => {
  const link = document.getElementById('returning-link');
  if (link && !localStorage.getItem('antigravity_tutor_state_v2')) {
    link.style.display = 'none';
  }
});
</script>
</body>
</html>
